<style>
  :root{
    --ink:#172033; --muted:#566176; --faint:#6f7889;
    --line:#dfe3e8; --line-soft:#edf0f3;
    --surface:#fff; --canvas:#f5f6f8;
    --accent:#234b72; --accent-hover:#183b5d; --accent-soft:#eaf1f7;
    --ok:#246247; --ok-soft:#eaf5ef; --ok-line:#c6e2d2;
    --warn:#76550d; --warn-soft:#fff6df; --warn-line:#ead69d;
    --stop:#8a2e2e; --stop-soft:#fff0f0; --stop-line:#ebc6c6;
    --radius:12px; --shadow:0 1px 2px rgba(17,24,39,.04);
  }
  *{box-sizing:border-box}
  html{background:var(--canvas)}
  body{
    margin:0; background:var(--canvas); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent)} a:hover{color:var(--accent-hover)}
  .wrap{max-width:1180px; margin:0 auto; padding:24px 32px 80px}
  main{display:block}
  .app-header{margin-bottom:32px}
  .app-top{display:flex; align-items:flex-start; justify-content:space-between; gap:24px}
  .brand-link{color:var(--ink); text-decoration:none; font-size:18px; font-weight:700}
  .brand-link span{display:block; color:var(--muted); font-size:13px; font-weight:400; margin-top:2px}
  .context-box{display:flex; align-items:center; justify-content:flex-end; gap:12px; min-width:0}
  .context-copy{text-align:right; min-width:0}
  .context-copy b{display:block; font-size:14px}
  .context-copy span{display:block; color:var(--muted); font-size:12.5px}
  .mode-switch{display:flex; gap:4px; padding:4px; background:#e9edf1; border-radius:10px}
  .mode-switch button{border:0; background:transparent; min-height:34px; padding:7px 10px; font-size:12.5px; white-space:nowrap}
  .mode-switch button[aria-pressed="true"]{background:#fff; color:var(--ink); box-shadow:var(--shadow); cursor:default; opacity:1}
  .main-nav{display:flex; align-items:center; gap:4px; margin-top:20px; padding:5px; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow-x:auto}
  .main-nav a{color:var(--muted); text-decoration:none; padding:8px 12px; border-radius:8px; font-size:14px; white-space:nowrap}
  .main-nav a:hover{background:var(--canvas); color:var(--ink)}
  .main-nav a[aria-current="page"]{background:var(--accent-soft); color:var(--accent); font-weight:650}
  h1{font-size:26px; line-height:1.2; letter-spacing:-.025em; margin:0 0 8px}
  h2{font-size:17px; line-height:1.3; margin:0 0 14px}
  h3{font-size:15px; margin:0 0 8px}
  .lede{font-size:15px; color:var(--muted); margin:0 0 26px; max-width:68ch}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:24px}
  .page-head .lede{margin-bottom:0}
  section{margin-top:32px}
  .sec-head{display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:12px}
  .sec-head h2{margin:0}.sec-note{font-size:13px; color:var(--muted)}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .card.pad{padding:22px 24px}
  .grid{display:grid; gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metric{padding:20px 22px}.metric .label{display:block; color:var(--muted); font-size:13px; margin-bottom:7px}
  .metric .value{font-size:26px; line-height:1.15; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .metric .hint{color:var(--muted); font-size:13px; margin-top:6px}
  .note{border-radius:9px; padding:13px 15px; font-size:14px; line-height:1.55; margin-bottom:18px}
  .note.ok{background:var(--ok-soft); border:1px solid var(--ok-line); color:var(--ok)}
  .note.warn{background:var(--warn-soft); border:1px solid var(--warn-line); color:var(--warn)}
  .note.stop{background:var(--stop-soft); border:1px solid var(--stop-line); color:var(--stop)}
  .note.neutral{background:var(--accent-soft); border:1px solid #cfdeeb; color:var(--accent)}
  .note b{font-weight:700}
  button,.btn,.btn-link{appearance:none; font:inherit; font-size:14px; line-height:1.2; min-height:40px; padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:7px}
  button:hover,.btn:hover,.btn-link:hover{background:#f1f3f5; border-color:#cbd1d8; color:var(--ink)}
  button.primary,.btn.primary,.btn-link.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button.primary:hover,.btn.primary:hover,.btn-link.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover); color:#fff}
  button.ghost,.btn.ghost{background:transparent; color:var(--muted)} button.danger{color:var(--stop); border-color:var(--stop-line)}
  button:disabled,.btn[aria-disabled="true"]{opacity:.55; cursor:not-allowed}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #8bb7df; outline-offset:2px}
  .actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:20px}.actions form{margin:0}
  label{display:block; font-size:14px; font-weight:650; margin-bottom:6px}
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=password],input[type=file],select,textarea{width:100%; min-width:0; font:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid #cfd5dc; border-radius:8px; padding:10px 11px}
  .owner-page{max-width:760px}.facts b{overflow-wrap:anywhere}h1{overflow-wrap:anywhere}
  textarea{min-height:180px; resize:vertical; line-height:1.55}.field{margin-bottom:18px}.help{font-size:13px; color:var(--muted); margin:5px 0 8px}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px}.facts div span{display:block;color:var(--muted);font-size:12.5px;margin-bottom:3px}.facts div b{font-size:14px}.req{color:var(--stop);font-weight:650}.faint{color:var(--faint)}
  .table-wrap{overflow-x:auto; border-radius:var(--radius)}
  table{width:100%; border-collapse:collapse; font-size:14px} th{text-align:left; color:var(--muted); font-size:12.5px; font-weight:650; padding:11px 14px; border-bottom:1px solid var(--line)}
  td{padding:13px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle} tr:last-child td{border-bottom:0} tbody tr:hover{background:#fafbfc}
  .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}.muted{color:var(--muted)}.small{font-size:13px}.mono{font-variant-numeric:tabular-nums}
  .pill{display:inline-flex; align-items:center; border-radius:999px; padding:4px 9px; font-size:12px; font-weight:650; white-space:nowrap; background:var(--accent-soft); color:var(--accent)}
  .pill.ok{background:var(--ok-soft); color:var(--ok)}.pill.warn{background:var(--warn-soft); color:var(--warn)}.pill.stop{background:var(--stop-soft); color:var(--stop)}.pill.neutral{background:#eef0f3; color:var(--muted)}
  details.disclosure{border-top:1px solid var(--line-soft)} details.disclosure > summary{cursor:pointer; list-style:none; padding:14px 0; color:var(--accent); font-size:14px; font-weight:600}
  details.disclosure > summary::-webkit-details-marker{display:none} details.disclosure > summary::before{content:"+"; display:inline-block; width:20px; color:var(--muted)} details.disclosure[open] > summary::before{content:"−"}
  .empty{padding:40px 24px; text-align:center}.empty h2{margin-bottom:8px}.empty p{margin:0 auto; max-width:52ch; color:var(--muted)}
  footer{margin-top:48px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:12.5px}
  .toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%,80px); opacity:0; z-index:100; max-width:min(620px,calc(100vw - 32px)); background:var(--ink); color:#fff; padding:12px 16px; border-radius:9px; transition:.2s ease}.toast.show{transform:translate(-50%,0); opacity:1}
  @media (max-width:760px){.wrap{padding:18px 16px 64px}.app-top{display:block}.context-box{justify-content:space-between; margin-top:16px; align-items:flex-end}.context-copy{text-align:left}.main-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;margin-left:-2px;margin-right:-2px;overflow:visible}.main-nav a{padding:9px 4px;text-align:center}.page-head{display:block}.page-head .actions{margin-top:16px}.grid.two,.grid.three,.form-grid{grid-template-columns:1fr}.card.pad{padding:18px}.metric .value{font-size:23px}.sec-head{display:block}.sec-note{margin-top:4px}button,.btn,.btn-link{min-height:44px}}
  @media (max-width:430px){.context-box{display:block}.mode-switch{margin-top:10px; width:100%}.mode-switch button{flex:1}.actions{align-items:stretch}.actions > button,.actions > .btn,.actions > .btn-link,.actions > form{width:100%}.actions form button{width:100%}}
</style>
